<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KIC Message Board</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <p class="eyebrow">KIC Web Application Starter</p>
        <h1>Message Board</h1>
        <p class="intro">A small example of a frontend getting data from a backend.</p>
      </header>

      <section class="composer" aria-labelledby="composer-heading">
        <h2 id="composer-heading">Post a message</h2>
        <form id="message-form" class="message-form">
          <label for="author">
            Name
            <input id="author" name="author" type="text" maxlength="50" autocomplete="name" required placeholder="Your name">
          </label>
          <label for="message">
            Message
            <textarea id="message" name="message" maxlength="500" rows="3" required placeholder="Write something..."></textarea>
          </label>
          <div class="form-footer">
            <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
            <button type="submit">Send message</button>
          </div>
        </form>
      </section>

      <section aria-labelledby="messages-heading">
        <div class="section-heading">
          <h2 id="messages-heading">Latest messages</h2>
          <span id="message-count" class="message-count" aria-live="polite"></span>
        </div>
        <p id="status" class="status" role="status">Loading messages...</p>
        <ul id="messages" class="messages" aria-label="Messages"></ul>
      </section>
    </main>
  </body>
</html>
